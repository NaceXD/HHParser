<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Вакансии Агрегатор</title>
    <!-- Подключаем иконки по сети -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Подключаем наш внешний файл стилей -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1><i class="fa-solid fa-briefcase"></i> Агрегатор вакансий HH</h1>
            <p>Умный поиск, локальное хранение и анализ навыков</p>
        </div>

        <!-- БЛОК 1: Запуск парсера -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-cloud-download" style="color: #2563eb;"></i> 1. Сканировать новые вакансии с hh.ru</h2>
            <div class="form-group">
                <input type="text" id="parser-input" placeholder="Например: Python или Data Scientist" class="form-input">
                <button onclick="startParsing()" class="btn btn-blue">
                    <i class="fa-solid fa-play" style="font-size: 0.75rem;"></i> Запустить
                </button>
            </div>
            <div id="parser-status" class="status-box"></div>
        </div>

        <!-- БЛОК 2: Поиск по базе данных -->
        <div class="card-panel">
            <h2><i class="fa-solid fa-database" style="color: #10b981;"></i> 2. Поиск вакансий в локальной базе данных</h2>
            <div class="form-group">
                <input type="text" id="search-input" placeholder="Введите ключевое слово для поиска в БД..." class="form-input search-input-focus">
                <button onclick="loadVacancies()" class="btn btn-green">
                    <i class="fa-solid fa-magnifying-glass"></i> Найти
                </button>
            </div>
        </div>

        <!-- БЛОК 3: Вывод карточек вакансий -->
        <div>
            <h2 class="section-title"><i class="fa-solid fa-list-ul"></i> Найденные вакансии</h2>
            <div id="vacancies-container" class="vacancies-list">
                <div class="empty-state">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>Загрузите вакансии с помощью сканера или воспользуйтесь поиском</p>
                </div>
            </div>
            <!-- Блок управления страницами (пагинация) -->
            <div id="pagination-container" class="pagination-panel" style="display: none;">
                <button onclick="changePage(-1)" id="btn-prev" class="btn btn-pagination">
                    <i class="fa-solid fa-chevron-left"></i> Назад
                </button>
                <span id="page-info" class="page-info-text">Страница 1 из 1</span>
                <button onclick="changePage(1)" id="btn-next" class="btn btn-pagination">
                    Вперед <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>


    <script>
        const API_BASE_URL = '/api';

        // Глобальные переменные для управления состоянием пагинации
        let allVacancies = [];    // Тут храним ВСЕ скачанные вакансии
        let currentPage = 1;      // Текущая открытая страница
        const itemsPerPage = 10;  // Лимит вакансий на одну страницу

        // 1. Функция загрузки данных с бэкенда
        async function loadVacancies() {
            const searchQuery = document.getElementById('search-input').value.trim();
            const container = document.getElementById('vacancies-container');
            const paginationContainer = document.getElementById('pagination-container');

            let url = `${API_BASE_URL}/vacancies`;
            if (searchQuery) {
                url += `?search=${encodeURIComponent(searchQuery)}`;
            }

            try {
                // Скрываем пагинацию на время загрузки
                if (paginationContainer) paginationContainer.style.display = 'none';
                container.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>Загрузка вакансий...</p></div>';

                const response = await fetch(url);
                allVacancies = await response.json(); // Сохраняем ВСЁ в глобальный массив

                if (allVacancies.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>В базе данных пока нет вакансий по этому запросу.</p></div>';
                    return;
                }

                currentPage = 1; // Сбрасываем страницу на первую при каждом новом поиске
                displayPage(currentPage); // Вызываем функцию отрисовки конкретной страницы

            } catch (error) {
                console.error('Ошибка:', error);
                container.innerHTML = '<div class="empty-state text-red"><i class="fa-solid fa-triangle-exclamation"></i><p>Не удалось связаться с сервером API.</p></div>';
            }
        }

        // 2. Функция, которая нарезает массив по 10 штук и выводит на экран
        function displayPage(page) {
            const container = document.getElementById('vacancies-container');
            container.innerHTML = ''; // Чистим контейнер перед отрисовкой страницы

            // Вычисляем индексы среза массива вакансий
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;

            // Нарезаем ровно 10 вакансий для текущей страницы
            const pageItems = allVacancies.slice(startIndex, endIndex);

            // Oтрисовываем эти 10 карточек
            pageItems.forEach(vacancy => {
                let salaryText = 'Зарплата не указана';
                if (vacancy.salary_from || vacancy.salary_to) {
                    const from = vacancy.salary_from ? `от ${vacancy.salary_from.toLocaleString('ru-RU')}` : '';
                    const to = vacancy.salary_to ? `до ${vacancy.salary_to.toLocaleString('ru-RU')}` : '';
                    salaryText = `${from} ${to} ${vacancy.salary_currency}`.trim();
                }

                const skillsHtml = vacancy.skills.map(skill =>
                    `<span class="skill-badge">${skill}</span>`
                ).join('');

                const vacancyCard = `
                    <div class="vacancy-card">
                        <div class="vacancy-header">
                            <h3 class="vacancy-title">
                                <a href="${vacancy.url}" target="_blank">${vacancy.title}</a>
                            </h3>
                            <span class="vacancy-salary">${salaryText}</span>
                        </div>
                        <div class="vacancy-meta">
                            <p><i class="fa-solid fa-building text-slate-400"></i> <strong>Компания:</strong> ${vacancy.company || 'Не указана'}</p>
                            <p><i class="fa-solid fa-location-dot text-slate-400"></i> <strong>Город:</strong> ${vacancy.city || 'Не указан'}</p>
                        </div>
                        <div class="skills-box">
                            ${skillsHtml || '<span class="no-skills">Навыки не указаны</span>'}
                        </div>
                        <div class="vacancy-footer">
                            <span><i class="fa-regular fa-calendar"></i> Добавлено: ${vacancy.published_at || 'Не указано'}</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', vacancyCard);
            });

            // Обновляем состояние кнопок пагинации
            updatePaginationControls();
        }

        // 3. Функция обновления кнопок и счетчика страниц
        function updatePaginationControls() {
            const paginationContainer = document.getElementById('pagination-container');
            const pageInfo = document.getElementById('page-info');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            // Считаем общее количество страниц
            const totalPages = Math.ceil(allVacancies.length / itemsPerPage);

            // Если страница всего одна (или вакансий меньше 10) — прячем всю панель пагинации
            if (totalPages <= 1) {
                if (paginationContainer) paginationContainer.style.display = 'none';
                return;
            }

            // Показываем панель пагинации
            if (paginationContainer) paginationContainer.style.display = 'flex';
            if (pageInfo) pageInfo.innerText = `Страница ${currentPage} из ${totalPages}`;

            // Блокируем кнопку "Назад", если мы на первой странице
            if (btnPrev) btnPrev.disabled = (currentPage === 1);

            // Блокируем кнопку "Вперед", если мы на самой последней странице
            if (btnNext) btnNext.disabled = (currentPage === totalPages);
        }

        // 4. Функция переключения страницы при клике на кнопки (+1 или -1)
        function changePage(direction) {
            currentPage += direction;
            displayPage(currentPage);

            // Плавно скроллим страницу вверх к результатам поиска, чтобы пользователю было удобно
            document.getElementById('vacancies-container').scrollIntoView({ behavior: 'smooth' });
        }

        // 5. Функция для отправки запроса на запуск парсера
        async function startParsing() {
            const searchText = document.getElementById('parser-input').value.trim();
            const statusDiv = document.getElementById('parser-status');

            if (!searchText) {
                statusDiv.className = "status-box status-error";
                statusDiv.style.display = "block";
                statusDiv.innerText = "Пожалуйста, введите ключевое слово.";
                return;
            }

            try {
                statusDiv.className = "status-box";
                statusDiv.style.display = "block";
                statusDiv.style.backgroundColor = "#f8fafc";
                statusDiv.style.color = "#64748b";
                statusDiv.innerText = "Отправка запроса...";

                const response = await fetch(`${API_BASE_URL}/parser/start?search_text=${encodeURIComponent(searchText)}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    statusDiv.className = "status-box status-success";
                    statusDiv.innerText = data.message || "Парсинг успешно запущен!";
                    document.getElementById('parser-input').value = "";
                } else {
                    statusDiv.className = "status-box status-error";
                    statusDiv.innerText = data.error || "Произошла ошибка при запуске.";
                }
            } catch (error) {
                console.error('Ошибка:', error);
                statusDiv.className = "status-box status-error";
                statusDiv.innerText = "Ошибка сети. Проверь работу FastAPI бэкенда.";
            }
        }

        // Автоматически подгружаем последние вакансии при открытии страницы
        window.onload = loadVacancies;
    </script>

</body>
</html>
